<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderadores EM - DEJEM</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f3f6fb;
        }

        .moderadores-page {
            max-width: 1400px;
        }

        .opm-chip {
            display: inline-block;
            min-width: 210px;
            padding: 4px 8px;
            border-radius: 6px;
            color: #fff;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
        }

        .table-moderadores th,
        .table-moderadores td {
            vertical-align: middle;
            font-size: 0.86rem;
        }
    </style>
</head>
<body>
    <main class="container-fluid moderadores-page py-4">
        <section class="mb-3">
            <h1 class="h4 mb-1">Prévia de Acesso - Moderadores EM</h1>
            <p class="text-muted mb-0">Cadastro liberado para coleta inicial dos possíveis moderadores nível 2.</p>
        </section>

        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="formModerador" autocomplete="off">
                    <div class="row g-3">
                        <div class="col-6 col-md-2">
                            <label class="form-label fw-bold" for="inputRE">RE</label>
                            <input type="text" class="form-control" id="inputRE" inputmode="numeric" maxlength="6" required>
                        </div>
                        <div class="col-6 col-md-1">
                            <label class="form-label fw-bold" for="inputDC">DC</label>
                            <input type="text" class="form-control text-uppercase" id="inputDC" maxlength="1" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label fw-bold" for="inputNomeCompleto">Nome completo</label>
                            <input type="text" class="form-control text-uppercase" id="inputNomeCompleto" required>
                        </div>
                        <div class="col-12 col-md-2">
                            <label class="form-label fw-bold" for="selectPostGrad">Posto/Grad</label>
                            <select class="form-select" id="selectPostGrad" required>
                                <option value="">Selecione</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-3">
                            <label class="form-label fw-bold" for="inputEmail">E-mail</label>
                            <input type="email" class="form-control" id="inputEmail" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label fw-bold" for="selectOPM">OPM</label>
                            <select class="form-select" id="selectOPM" required>
                                <option value="">Selecione</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-3">
                            <label class="form-label fw-bold" for="inputCPF">CPF</label>
                            <input type="text" class="form-control" id="inputCPF" inputmode="numeric" maxlength="14" required>
                        </div>
                        <div class="col-12 col-md-3">
                            <label class="form-label fw-bold" for="inputWhatsApp">WhatsApp</label>
                            <input type="text" class="form-control" id="inputWhatsApp" inputmode="numeric" maxlength="15" required>
                        </div>
                        <div class="col-12 col-md-2 d-flex align-items-end gap-2">
                            <button type="reset" class="btn btn-outline-secondary w-50">
                                Limpar
                            </button>
                            <button type="submit" class="btn btn-primary w-50" id="btnSalvarModerador">
                                <i class="fas fa-plus me-1"></i>Adicionar moderador
                            </button>
                        </div>
                    </div>
                </form>
                <div id="mensagemModerador" class="mt-3"></div>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h2 class="h6 mb-0">Moderadores cadastrados</h2>
                <span class="badge bg-primary" id="contadorModeradores">0</span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-sm table-moderadores mb-0">
                    <thead class="table-light">
                        <tr>
                            <th width="90">RE</th>
                            <th width="60">DC</th>
                            <th>Nome completo</th>
                            <th width="260">OPM</th>
                            <th width="140">Posto/Grad</th>
                            <th>E-mail</th>
                            <th width="140">CPF</th>
                            <th width="150">WhatsApp</th>
                            <th width="70">Editar</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyModeradores">
                        <tr>
                            <td colspan="9" class="text-center py-4 text-muted">
                                <i class="fas fa-spinner fa-spin me-2"></i>Carregando
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/moderadoresSgb.js"></script>
</body>
</html>
